name: Deploy Docs

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  docs:
    name: Make the docs
    runs-on: ubuntu-latest
    container:
      image: djhaskin987/roswell-sbcl-ocicl:latest
      options: --cpus 1 --user root
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # zick depends on CLIFF, NRDL, and svers, which are developed in
      # sibling repos. The published CLIFF/NRDL releases can lag the
      # local checkouts, so check out all three and register them with
      # ASDF via CL_SOURCE_REGISTRY below.
      - name: Check out djha-skin dependency repos
        run: |
          mkdir -p systems
          git clone --depth 1 https://github.com/djha-skin/cliff.git systems/cliff
          git clone --depth 1 https://github.com/djha-skin/nrdl.git systems/nrdl
          git clone --depth 1 https://github.com/djha-skin/svers.git systems/svers

      - name: Restore cache
        id: cache-cache
        uses: actions/cache@v3
        with:
          path: |
            /home/builder/.roswell
            /home/builder/.cache/common-lisp
          key: ${{ runner.os }}

      - name: Make the docs
        run: |
          chown -R builder: .
          chmod ugo+rwX -R .
          su builder << BUILDER
          export CL_SOURCE_REGISTRY="$PWD/systems//:"
          ocicl install
          make docs
          BUILDER

      # The Makefile links index.html to overview.html as a symlink;
      # upload-pages-artifact does not preserve symlinks, which would
      # 404 the site root. Replace the symlink with a real copy first.
      - name: Materialize index.html
        run: cp docs/build/zick-zip-based-package-manager/html/overview.html docs/build/zick-zip-based-package-manager/html/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload docs
          path: 'docs/build/zick-zip-based-package-manager/html/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
