# release.yml — build zick for the per-distro matrix and publish a GitHub
# Release when a v* tag is pushed.
#
# Linux legs run inside the prebuilt per-distro build images from the
# sbcl-ocicl-fpm repo (ghcr.io/djha-skin/sbcl-ocicl-fpm) which carry SBCL,
# ocicl, Roswell, FPM, and the distro packaging tools.  Each Linux leg emits
# the binary package for its distro (deb via fpm for debian/ubuntu, rpm via
# fpm for fedora) plus the SOURCE package (Debian source package for
# debian/ubuntu, .src.rpm for fedora).  Fedora/Ubuntu COPR and PPA publishing
# are deferred; for now every artifact rides on the GitHub Release page.
# macOS and Windows legs emit the platform binaries.
#
# The release job assembles everything with `gh release create`.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux-matrix:
    name: linux (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debian-stable, image: debian13,   pkg: deb }
          - { name: ubuntu-2404,   image: ubuntu2404, pkg: deb }
          - { name: ubuntu-2604,   image: ubuntu2604, pkg: deb }
          - { name: fedora-43,     image: fedora43,   pkg: rpm }
          - { name: fedora-44,     image: fedora44,   pkg: rpm }
    container:
      image: ghcr.io/djha-skin/sbcl-ocicl-fpm:${{ matrix.image }}-latest
    steps:
      - uses: actions/checkout@v4

      - name: ocicl setup and install deps
        run: |
          ocicl setup
          # Retry the install: ghcr.io downloads are occasionally flaky
          # (transient TLS/network errors) and a full retry is cheap.
          i=0
          until ocicl install; do
            i=$((i+1))
            [ "$i" -ge 3 ] && exit 1
            echo "ocicl install attempt $i failed; retrying..."
            sleep 5
          done

      - name: clone sibling systems
        run: |
          mkdir -p ~/common-lisp
          # core.autocrlf=false: on Windows, Git would otherwise check the
          # siblings out with CRLF endings, which breaks the multi-line
          # format strings in cliff (SBCL's FORMATTER rejects ~ followed by
          # a Return character).
          for r in cliff nrdl svers; do
            git clone --quiet --depth 1 --config core.autocrlf=false \
              "https://github.com/djha-skin/$r.git" ~/common-lisp/$r
          done

      - name: build zick
        run: |
          sbcl --dynamic-space-size 4096 --control-stack-size 32 \
               --non-interactive --load scripts/ci-build.lisp
          test -x "$GITHUB_WORKSPACE/zick"

      - name: smoke test
        run: |
          TMPD=$(mktemp -d)
          cd "$TMPD"
          "$GITHUB_WORKSPACE/zick" init
          "$GITHUB_WORKSPACE/zick" list

      - name: make source tarballs
        run: bash scripts/make-source-tarball.sh "${GITHUB_REF_NAME#v}"

      - name: produce binary package
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p pkg/usr/bin
          install -m755 zick pkg/usr/bin/zick
          if [ "${{ matrix.pkg }}" = deb ]; then
            # fpm writes the package into the step cwd, which is the
            # workspace; no copy needed.
            fpm -s dir -t deb -n zick -v "$VERSION" -a amd64 -C pkg \
                --description "A zip-based package manager for Common Lisp systems" \
                --url "https://github.com/djha-skin/zick" --license MIT \
                --maintainer "Daniel Jay Haskin <djhaskin987@gmail.com>" .
          else
            # fpm writes the package into the step cwd, which is the
            # workspace; no copy needed.
            fpm -s dir -t rpm -n zick -v "$VERSION" -a x86_64 -C pkg \
                --description "A zip-based package manager for Common Lisp systems" \
                --url "https://github.com/djha-skin/zick" --license MIT \
                --maintainer "Daniel Jay Haskin <djhaskin987@gmail.com>" .
          fi

      - name: produce source package (deb)
        if: matrix.pkg == 'deb'
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/debsrc
          # dpkg-source looks for the .orig tarball beside the source dir
          # (../zick_${VERSION}.orig.tar.gz), so copy it in.
          cp "zick_${VERSION}.orig.tar.gz" /tmp/debsrc/
          tar xzf "zick_${VERSION}.orig.tar.gz" -C /tmp/debsrc
          cp -r packaging/debian "/tmp/debsrc/zick-${VERSION}/debian"
          cd "/tmp/debsrc/zick-${VERSION}"
          # dpkg-source -b builds the source package without touching
          # debian/rules, so no debhelper is needed in the build image.
          dpkg-source -b .
          cp ../zick_${VERSION}* "$GITHUB_WORKSPACE/"

      - name: produce source package (rpm)
        if: matrix.pkg == 'rpm'
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ~/rpmbuild/SOURCES ~/rpmbuild/SRPMS
          cp "zick-${VERSION}-src.tar.gz" ~/rpmbuild/SOURCES/
          rpmbuild -bs packaging/zick.spec
          cp ~/rpmbuild/SRPMS/*.src.rpm "$GITHUB_WORKSPACE/"

      # The generic tarball (runs on any modern-glibc distro) rides on the
      # ubuntu-24.04 leg; it is the "everyone else" Linux artifact.
      - name: package generic tarball
        if: matrix.name == 'ubuntu-2404'
        run: |
          tar czf zick-linux-x86_64.tar.gz -C "$GITHUB_WORKSPACE" zick

      - name: upload source package
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.name }}
          path: |
            zick-*.src.rpm
            zick-*.x86_64.rpm
            zick_*.dsc
            zick_*.debian.tar.xz
            zick_*.orig.tar.gz
            zick_*_amd64.deb
            zick-linux-x86_64.tar.gz

  macos:
    name: macos (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   runner: macos-13 }
          - { arch: arm64, runner: macos-14 }
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        run: brew install sbcl ocicl

      - name: clone sibling systems
        run: |
          mkdir -p ~/common-lisp
          # core.autocrlf=false: on Windows, Git would otherwise check the
          # siblings out with CRLF endings, which breaks the multi-line
          # format strings in cliff (SBCL's FORMATTER rejects ~ followed by
          # a Return character).
          for r in cliff nrdl svers; do
            git clone --quiet --depth 1 --config core.autocrlf=false \
              "https://github.com/djha-skin/$r.git" ~/common-lisp/$r
          done

      - name: build zick
        run: |
          ocicl setup
          # Retry the install: ghcr.io downloads are occasionally flaky
          # (transient TLS/network errors) and a full retry is cheap.
          i=0
          until ocicl install; do
            i=$((i+1))
            [ "$i" -ge 3 ] && exit 1
            echo "ocicl install attempt $i failed; retrying..."
            sleep 5
          done
          sbcl --dynamic-space-size 4096 --control-stack-size 32 \
               --non-interactive --load scripts/ci-build.lisp
          test -x "$GITHUB_WORKSPACE/zick"

      - name: smoke test
        run: |
          TMPD=$(mktemp -d)
          cd "$TMPD"
          "$GITHUB_WORKSPACE/zick" init
          "$GITHUB_WORKSPACE/zick" list

      - name: package
        run: |
          cd "$GITHUB_WORKSPACE"
          tar czf zick-macos-${{ matrix.arch }}.tar.gz zick

      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: zick-macos-${{ matrix.arch }}.tar.gz

  windows:
    name: windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Scoop instead of Chocolatey: not preinstalled on the runner, but the
      # one-line bootstrap is cheap, and Scoop extracts the official SBCL MSI
      # into a deterministic per-user dir (~/scoop/apps/sbcl/current) with
      # the runtime DLLs beside sbcl.exe — no MSI-installer path hunting.
      # It also matches how we distribute zick itself (Scoop manifest).
      - name: install sbcl
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -UseBasicParsing get.scoop.sh | Invoke-Expression
          scoop install sbcl

      - name: install ocicl
        shell: bash
        run: |
          curl -fSsL -o /tmp/ocicl.zip \
            https://github.com/ocicl/ocicl/releases/download/v2.17.0/ocicl-2.17.0-windows-amd64.zip
          mkdir -p /tmp/ocicl-bin
          cd /tmp/ocicl-bin
          unzip -oq /tmp/ocicl.zip
          # Add the Windows-native path (cygpath) so the SBCL build process
          # (a Windows CreateProcess child) can find ocicl.exe on PATH — a
          # bare /tmp/ocicl-bin only works inside Git Bash.
          echo "$(cygpath -w /tmp/ocicl-bin)" >> "$GITHUB_PATH"

      - name: clone sibling systems
        shell: bash
        run: |
          mkdir -p ~/common-lisp
          # core.autocrlf=false: on Windows, Git would otherwise check the
          # siblings out with CRLF endings, which breaks the multi-line
          # format strings in cliff (SBCL's FORMATTER rejects ~ followed by
          # a Return character).
          for r in cliff nrdl svers; do
            git clone --quiet --depth 1 --config core.autocrlf=false \
              "https://github.com/djha-skin/$r.git" ~/common-lisp/$r
          done

      - name: build zick
        shell: bash
        run: |
          # Scoop shims (sbcl) live in ~/scoop/shims.
          export PATH="$HOME/scoop/shims:$PATH"
          ocicl setup
          # Retry the install: ghcr.io downloads are occasionally flaky
          # (transient TLS/network errors) and a full retry is cheap.
          i=0
          until ocicl install; do
            i=$((i+1))
            [ "$i" -ge 3 ] && exit 1
            echo "ocicl install attempt $i failed; retrying..."
            sleep 5
          done
          sbcl --dynamic-space-size 4096 --control-stack-size 32 \
               --non-interactive --load scripts/ci-build.lisp
          # $GITHUB_WORKSPACE is a Windows-style path (D:\a\zick\zick) that
          # Git Bash's test builtin cannot resolve, so cd and test relative
          # paths.  SBCL appends .exe to the saved image name; guard both.
          cd "$GITHUB_WORKSPACE"
          ls -la | grep -iE 'zick' || true
          if [ ! -x zick.exe ] && [ -x zick ]; then
            mv zick zick.exe
          fi
          test -x zick.exe

      - name: bundle runtime DLLs
        shell: bash
        run: |
          # SBCL's Windows executable needs its runtime DLLs next to it.
          # Scoop installs SBCL to ~/scoop/apps/sbcl/current with the DLLs
          # beside sbcl.exe; fall back to searching the machine for
          # libsbcl.dll in case the layout ever differs.
          cd "$GITHUB_WORKSPACE"
          SBCL_DIR="$HOME/scoop/apps/sbcl/current"
          if [ ! -f "$SBCL_DIR/libsbcl.dll" ]; then
            SBCL_DIR="$(dirname "$(find /c/Program\ Files /c/ProgramData/chocolatey \
                -iname 'libsbcl.dll' 2>/dev/null | head -1)")"
          fi
          echo "SBCL_DIR=$SBCL_DIR"
          cp "$SBCL_DIR"/libsbcl.dll .
          cp "$SBCL_DIR"/libgcc_s_seh-1.dll . 2>/dev/null || true
          cp "$SBCL_DIR"/libwinpthread-1.dll . 2>/dev/null || true

      # Smoke test AFTER the DLLs are bundled: zick.exe dies on a missing
      # libsbcl.dll otherwise.
      - name: smoke test
        shell: bash
        run: |
          TMPD=$(mktemp -d)
          cd "$TMPD"
          "$GITHUB_WORKSPACE/zick.exe" init
          "$GITHUB_WORKSPACE/zick.exe" list

      - name: package
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          zip zick-windows-x64.zip zick.exe libsbcl.dll libgcc_s_seh-1.dll libwinpthread-1.dll

      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: zick-windows-x64.zip

  release:
    name: assemble release
    needs: [linux-matrix, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          gh release create "$TAG" \
            artifacts/* \
            --title "zick ${VERSION}" \
            --notes "zick ${VERSION} — see the manual (https://djha-skin.github.io/zick/) for install instructions. This release ships prebuilt binaries for Linux (x86_64), macOS (x86_64 + arm64), and Windows (x64), plus binary and source packages for Debian/Ubuntu (deb) and Fedora/RHEL (rpm)."
